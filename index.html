<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Zenloft Studio — Premium Digital Agency | Web Development, Marketing & AI Automation</title>
    <meta name="description" content="Zenloft Studio is a premium digital agency specializing in website development, digital marketing, social media management, branding, content creation, and AI business automation." />
    <meta name="author" content="Zenloft Studio" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="digital agency, website development, digital marketing, social media management, branding and design, content creation, AI business automation, Zenloft Studio" />
    <link rel="canonical" href="https://zenloftstudio.online/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#00E5FF" />
    <meta name="msapplication-TileColor" content="#080812" />

    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zenloftstudio.online/" />
    <meta property="og:site_name" content="Zenloft Studio" />
    <meta property="og:title" content="Zenloft Studio — Premium Digital Agency | Web Development, Marketing & AI Automation" />
    <meta property="og:description" content="We build digital empires. Premium web development, marketing, and AI automation for bold brands worldwide." />
    <meta property="og:image" content="https://zenloftstudio.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zenloft Studio — We Build Digital Empires" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zenloftstudio" />
    <meta name="twitter:creator" content="@zenloftstudio" />
    <meta name="twitter:title" content="Zenloft Studio — Premium Digital Agency | Web Development, Marketing & AI Automation" />
    <meta name="twitter:description" content="We build digital empires. Premium web development, marketing, and AI automation for bold brands worldwide." />
    <meta name="twitter:image" content="https://zenloftstudio.online/og-image.png" />
    <meta name="twitter:image:alt" content="Zenloft Studio — We Build Digital Empires" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

    <!-- Custom Cursor -->
    <style>
      * { cursor: none !important; }
      @media (pointer: coarse) { * { cursor: auto !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- JSON-LD Structured Data: ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Zenloft Studio",
      "alternateName": "Zenloft",
      "url": "https://zenloftstudio.online",
      "logo": "https://zenloftstudio.online/og-image.png",
      "image": "https://zenloftstudio.online/og-image.png",
      "email": "hello@zenloftstudio.online",
      "description": "Zenloft Studio is a premium digital agency specializing in website development, digital marketing, social media management, branding, content creation, and AI business automation for bold brands worldwide.",
      "foundingDate": "2023",
      "priceRange": "$500 - $25,000+",
      "areaServed": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "serviceType": [
        "Website Development",
        "Digital Marketing",
        "Social Media Management",
        "Branding & Design",
        "Content Creation",
        "AI Business Automation"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Website Development",
              "description": "Pixel-perfect, responsive websites built with modern frameworks like Next.js, React, and TypeScript."
            },
            "priceCurrency": "USD",
            "price": "1500"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI Business Automation",
              "description": "Intelligent systems that streamline workflows — customer support bots, data-processing pipelines, and AI-powered tools."
            },
            "priceCurrency": "USD",
            "price": "3000"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Digital Marketing",
              "description": "Comprehensive marketing strategies that drive growth and maximize ROI across all channels."
            },
            "priceCurrency": "USD",
            "price": "2000"
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Branding & Design",
              "description": "Cohesive brand identities, premium logos, and comprehensive design systems."
            },
            "priceCurrency": "USD",
            "price": "2000"
          }
        ]
      },
      "sameAs": [
        "https://github.com/zenloftstudio",
        "https://www.linkedin.com/in/zenloftstudio",
        "https://x.com/zenloftstudio",
        "https://www.instagram.com/zenloftstudio"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Hyderabad",
        "addressRegion": "Telangana",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "17.385",
        "longitude": "78.4867"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@zenloftstudio.online",
        "contactType": "customer service",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Zenloft Studio",
      "url": "https://zenloftstudio.online",
      "description": "Premium digital agency — web design, AI development, marketing, social media.",
      "publisher": {
        "@type": "Organization",
        "name": "Zenloft Studio",
        "url": "https://zenloftstudio.online",
        "logo": "https://zenloftstudio.online/og-image.png"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://zenloftstudio.online/works?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What services does Zenloft Studio offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zenloft Studio offers a comprehensive range of digital services including Website Development, Digital Marketing, Social Media Management, Branding & Design, Content Creation, and AI Business Automation. We handle everything from concept to deployment."
          }
        },
        {
          "@type": "Question",
          "name": "How much does a website cost at Zenloft Studio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Website development costs at Zenloft Studio range from $500 for a professional landing page to $25,000+ for complex full-stack platforms. Every project is custom-built — we never use templates. We provide detailed proposals with fixed pricing so there are no surprises."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a project take to complete?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Project timelines at Zenloft Studio typically range from 2 to 6 weeks depending on scope and complexity. A high-converting landing page can be delivered in 2 weeks, a full business website in 3 to 4 weeks, and complex platforms in 4 to 6 weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Does Zenloft Studio work with international clients?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Zenloft Studio works with businesses worldwide. We communicate through video calls, email, and messaging platforms, and we adjust to your timezone for meetings."
          }
        },
        {
          "@type": "Question",
          "name": "What technologies does Zenloft Studio use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zenloft Studio uses cutting-edge technologies to build modern, high-performance digital products. Our primary tech stack includes React, Next.js, TypeScript, and Tailwind CSS for frontend development, Supabase and PostgreSQL for backend and databases, Stripe for payment processing, and various AI automation tools."
          }
        }
      ]
    }
    </script>
  </body>
</html>
